<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Tic Tac Toe</title>

    <style>

        .container{
            display:grid;
            grid-template-columns:auto auto auto;
            background-color:dodgerblue;
            padding:10px;
        }

        .container div{
            background-color:#f1f1f1;
            border:1px solid black;
            padding:30px;
            font-size:30px;
            text-align:center;
        }

    </style>

</head>


<body>

<h1>Tic Tac Toe</h1>

<div class="container">

    <div></div>
    <div></div>
    <div></div>

    <div></div>
    <div></div>
    <div></div>

    <div></div>
    <div></div>
    <div></div>

</div>


<button id="reset">
Reset
</button>


<p>
Winner:
<span id="winner"></span>
</p>


<script src="index.js"></script>

</body>

</html>
